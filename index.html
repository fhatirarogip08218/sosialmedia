<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sosmed Publik</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

  <!-- Navbar -->
  <nav class="bg-white shadow p-4 sticky top-0 z-10 flex justify-between items-center max-w-xl mx-auto">
    <h1 class="text-xl font-bold text-blue-600">SosmedKu</h1>
    <div id="auth-section">
      <button id="btn-login" class="bg-blue-600 text-white px-4 py-1.5 rounded-lg text-sm font-semibold hover:bg-blue-700">Masuk Google</button>
      <div id="user-info" class="hidden flex items-center gap-2">
        <img id="user-pic" class="w-8 h-8 rounded-full" src="" alt="Avatar">
        <span id="user-name" class="text-sm font-medium"></span>
        <button id="btn-logout" class="text-xs text-red-500 ml-2 hover:underline">Keluar</button>
      </div>
    </div>
  </nav>

  <main class="max-w-xl mx-auto p-4 space-y-6">
    <!-- Status / Stories Bar -->
    <section class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-xs font-bold text-gray-400 uppercase mb-3">Status Pengguna (24 Jam)</h2>
      <div id="status-list" class="flex gap-3 overflow-x-auto pb-2"></div>
      <div id="status-form" class="hidden mt-3 flex gap-2">
        <input id="status-input" type="text" maxlength="50" placeholder="Update status singkat..." class="flex-1 border rounded-lg px-3 py-1.5 text-sm focus:outline-blue-500">
        <button id="btn-post-status" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold">Update</button>
      </div>
    </section>

    <!-- Form Posting -->
    <section id="post-form" class="hidden bg-white p-4 rounded-xl shadow space-y-3">
      <textarea id="post-input" rows="3" placeholder="Apa yang sedang Anda pikirkan?" class="w-full border rounded-lg p-3 text-sm focus:outline-blue-500"></textarea>
      <div class="flex justify-end">
        <button id="btn-post" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-blue-700">Posting</button>
      </div>
    </section>

    <!-- Feed Postingan -->
    <section id="feed" class="space-y-4"></section>
  </main>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, setDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAA0jlzBReAlaCjIEX3Rd4ftwGZTtwXFJM",
      authDomain: "sosmedku-58ea6.firebaseapp.com",
      projectId: "sosmedku-58ea6",
      storageBucket: "sosmedku-58ea6.firebasestorage.app",
      messagingSenderId: "565963887039",
      appId: "1:565963887039:web:5a3ad1ff3b0797f56b510a"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    let currentUser = null;

    // Auth Handlers
    document.getElementById('btn-login').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('btn-logout').onclick = () => signOut(auth);

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      document.getElementById('btn-login').classList.toggle('hidden', !!user);
      document.getElementById('user-info').classList.toggle('hidden', !user);
      document.getElementById('post-form').classList.toggle('hidden', !user);
      document.getElementById('status-form').classList.toggle('hidden', !user);
      if (user) {
        document.getElementById('user-pic').src = user.photoURL;
        document.getElementById('user-name').textContent = user.displayName;
      }
    });

    // Update Status
    document.getElementById('btn-post-status').onclick = async () => {
      const text = document.getElementById('status-input').value.trim();
      if (!text || !currentUser) return;
      await setDoc(doc(db, "statuses", currentUser.uid), {
        name: currentUser.displayName,
        photo: currentUser.photoURL,
        status: text,
        updatedAt: serverTimestamp()
      });
      document.getElementById('status-input').value = '';
    };

    // Listen Status Real-time
    onSnapshot(collection(db, "statuses"), (snapshot) => {
      const list = document.getElementById('status-list');
      list.innerHTML = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        list.innerHTML += `
          <div class="flex-shrink-0 w-28 bg-blue-50 border border-blue-200 p-2 rounded-lg text-center">
            <img src="${d.photo}" class="w-10 h-10 rounded-full mx-auto mb-1 border-2 border-blue-500">
            <p class="text-xs font-bold truncate">${d.name}</p>
            <p class="text-[11px] text-gray-600 line-clamp-2 mt-1">"${d.status}"</p>
          </div>`;
      });
    });

    // Buat Postingan
    document.getElementById('btn-post').onclick = async () => {
      const text = document.getElementById('post-input').value.trim();
      if (!text || !currentUser) return;
      await addDoc(collection(db, "posts"), {
        uid: currentUser.uid,
        name: currentUser.displayName,
        photo: currentUser.photoURL,
        content: text,
        createdAt: serverTimestamp()
      });
      document.getElementById('post-input').value = '';
    };

    // Listen Postingan Real-time
    const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';
      snapshot.forEach(doc => {
        const d = doc.data();
        const date = d.createdAt ? d.createdAt.toDate().toLocaleString('id-ID') : 'Baru saja';
        feed.innerHTML += `
          <div class="bg-white p-4 rounded-xl shadow space-y-2">
            <div class="flex items-center gap-3">
              <img src="${d.photo}" class="w-10 h-10 rounded-full">
              <div>
                <h3 class="font-bold text-sm">${d.name}</h3>
                <span class="text-xs text-gray-400">${date}</span>
              </div>
            </div>
            <p class="text-sm text-gray-700 whitespace-pre-line">${d.content}</p>
          </div>`;
      });
    });
  </script>
</body>
</html>
